[project]
name = "garmin-connect-analyses"
version = "0.1.0"
description = "Analyse Garmin Connect activities."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "garmin-fit-sdk>=21.222.0",
    "matplotlib>=3.11.2",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"
